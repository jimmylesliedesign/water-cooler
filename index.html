<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>The Water Cooler: a tiny office RPG</title>
    <meta
      name="description"
      content="A cosy little pixel art game about a designer, an engineer and a product manager who are all sure AI means they don't need each other anymore."
    />
    <meta name="theme-color" content="#d9d9d9" />
    <meta property="og:title" content="The Water Cooler" />
    <meta
      property="og:description"
      content="A cosy little pixel art game about a designer, an engineer and a product manager who are all sure AI means they don't need each other anymore."
    />
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16' shape-rendering='crispEdges'%3E%3Crect x='5' y='0' width='6' height='7' fill='%238fd0f0'/%3E%3Crect x='4' y='7' width='8' height='9' fill='%23ebe8f1'/%3E%3Crect x='6' y='9' width='2' height='2' fill='%235aa8e0'/%3E%3Crect x='8' y='9' width='2' height='2' fill='%23e0584a'/%3E%3C/svg%3E"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400..700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/src/page.css" />
  </head>
  <body data-state="loading">
    <header class="bar">
      <a class="tool back" href="https://jimmyleslie.design">
        <span aria-hidden="true">&larr;</span> jimmyleslie.design
      </a>
      <button class="tool" id="sound" type="button" aria-pressed="false">
        <svg viewBox="0 0 16 16" width="16" height="16" aria-hidden="true" shape-rendering="crispEdges">
          <path fill="currentColor" d="M2 6h3l4-3v10l-4-3H2z" />
          <path class="sound__on" fill="currentColor" d="M11 5h1v6h-1zM13 3h1v10h-1z" />
          <path class="sound__off" fill="currentColor" d="M11 6h1v1h-1zM12 7h1v1h-1zM13 8h1v1h-1zM13 6h1v1h-1zM11 8h1v1h-1z" />
        </svg>
        <span id="soundLabel">Sound off</span>
      </button>
    </header>

    <main class="scene" id="scene">
      <h1 class="sr-only">The Water Cooler, a tiny office RPG</h1>

      <!-- Shown until the 3D handheld has loaded. -->
      <div class="placeholder" id="placeholder" aria-hidden="true">
        <div class="placeholder__body"><div class="placeholder__screen"></div></div>
      </div>

      <div class="gl" id="gl"></div>

      <!-- The real game, framed exactly over the model's screen while playing. -->
      <iframe
        class="game"
        id="game"
        src="game/index.html?embed"
        title="The Water Cooler"
        tabindex="-1"
        aria-hidden="true"
      ></iframe>

      <p class="prompt" id="prompt">
        <span class="only-keys">Press <kbd>space</kbd> to play</span>
        <span class="only-touch">Tap to play</span>
      </p>

      <p class="esc-hint" id="escHint"><kbd>esc</kbd> to leave</p>
    </main>

    <div class="pad" id="pad" aria-hidden="true">
      <div class="pad__dpad">
        <button type="button" data-key="ArrowUp" class="pad__dir pad__dir--up" aria-label="Up"></button>
        <button type="button" data-key="ArrowLeft" class="pad__dir pad__dir--left" aria-label="Left"></button>
        <button type="button" data-key="ArrowRight" class="pad__dir pad__dir--right" aria-label="Right"></button>
        <button type="button" data-key="ArrowDown" class="pad__dir pad__dir--down" aria-label="Down"></button>
      </div>
      <div class="pad__mid">
        <button type="button" data-action="exit" class="pad__pill">Exit</button>
        <button type="button" data-key="KeyP" class="pad__pill">Start</button>
      </div>
      <div class="pad__ab">
        <button type="button" data-key="KeyQ" class="pad__btn pad__btn--b">B</button>
        <button type="button" data-key="Space" class="pad__btn pad__btn--a">A</button>
      </div>
    </div>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
