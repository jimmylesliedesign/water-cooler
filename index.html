<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>The Water Cooler: a tiny office RPG</title>
    <meta
      name="description"
      content="A cosy little pixel art game about a designer, an engineer and a product manager who are all sure AI means they don't need each other anymore."
    />
    <meta name="theme-color" content="#1d1922" />
    <meta property="og:title" content="The Water Cooler" />
    <meta
      property="og:description"
      content="A cosy little pixel art game about a designer, an engineer and a product manager who are all sure AI means they don't need each other anymore."
    />
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16' shape-rendering='crispEdges'%3E%3Crect x='5' y='0' width='6' height='7' fill='%238fd0f0'/%3E%3Crect x='4' y='7' width='8' height='9' fill='%23ebe8f1'/%3E%3Crect x='6' y='9' width='2' height='2' fill='%235aa8e0'/%3E%3Crect x='8' y='9' width='2' height='2' fill='%23e0584a'/%3E%3C/svg%3E"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400..700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="app">
      <header class="bar" id="bar">
        <a class="back" href="https://jimmyleslie.design">
          <span aria-hidden="true">&larr;</span> jimmyleslie.design
        </a>
        <button class="sound" id="sound" type="button" aria-pressed="false">
          <svg viewBox="0 0 16 16" width="16" height="16" aria-hidden="true" shape-rendering="crispEdges">
            <path fill="currentColor" d="M2 6h3l4-3v10l-4-3H2z" />
            <path class="sound__on" fill="currentColor" d="M11 5h1v6h-1zM13 3h1v10h-1z" />
            <path class="sound__off" fill="currentColor" d="M11 6h1v1h-1zM12 7h1v1h-1zM13 8h1v1h-1zM13 6h1v1h-1zM11 8h1v1h-1z" />
          </svg>
          <span id="soundLabel">Sound off</span>
        </button>
      </header>

      <div class="device-wrap">
        <div class="device">
          <div class="device__ridge" aria-hidden="true"><span>&#9664;OFF&middot;ON&#9654;</span></div>

          <div class="bezel">
            <div class="bezel__strip" aria-hidden="true"><i></i><span>PIXEL OFFICE WITH STEREO SMALL TALK</span><i></i></div>
            <div class="led" aria-hidden="true"><span class="led__dot"></span><span class="led__label">BATTERY</span></div>

            <div class="lcd">
              <main class="stage" id="stage">
                <canvas
                  id="game"
                  width="214"
                  height="192"
                  role="img"
                  aria-label="A cosy pixel art office with a water cooler in the middle, where a designer, an engineer and a product manager are chatting."
                ></canvas>

                <div class="toast" id="toast" role="status" aria-live="polite"></div>

                <div class="dialogue" id="dialogue" hidden>
                  <div class="dialogue__portrait"><canvas id="portrait" width="14" height="12"></canvas></div>
                  <div class="dialogue__body">
                    <span class="dialogue__name" id="dlgName"></span>
                    <p class="dialogue__text" id="dlgText" aria-hidden="true"></p>
                  </div>
                  <span class="dialogue__next" aria-hidden="true"></span>
                  <p class="sr-only" id="dlgLive" aria-live="polite"></p>
                </div>

                <div class="title" id="title">
                  <div class="title__card">
                    <p class="title__kicker">A very small office RPG</p>
                    <h1 class="title__name">The Water Cooler</h1>
                    <div class="title__cast" id="cast"></div>
                    <p class="title__blurb">
                      Everyone just got new AI tools. Everyone is sure they don't need anyone else anymore.
                    </p>
                    <button class="title__start" id="start" type="button">
                      <span class="only-keys">Press Space to start</span>
                      <span class="only-touch">Press A to start</span>
                    </button>
                  </div>
                </div>
              </main>
            </div>
          </div>

          <div class="device__brand" aria-hidden="true"><small>THE</small>Water Cooler</div>

          <div class="controls" aria-hidden="true">
            <div class="dpad-well"></div>
            <div class="dpad" id="dpad">
              <div class="dpad__tilt">
                <svg class="dpad__body" viewBox="0 0 22 22">
                  <defs>
                    <linearGradient id="dpFill" gradientUnits="userSpaceOnUse" x1="3" y1="0" x2="19" y2="22">
                      <stop offset="0" style="stop-color: color-mix(in oklab, var(--dpad), white 16%)" />
                      <stop offset="0.55" style="stop-color: var(--dpad)" />
                      <stop offset="1" style="stop-color: color-mix(in oklab, var(--dpad), black 35%)" />
                    </linearGradient>
                    <radialGradient id="dpHub" cx="0.5" cy="0.62" r="0.6">
                      <stop offset="0" stop-color="#000" stop-opacity="0.45" />
                      <stop offset="1" stop-color="#000" stop-opacity="0" />
                    </radialGradient>
                    <linearGradient id="shTop" x1="0" y1="0" x2="0" y2="1">
                      <stop offset="0" stop-color="#000" stop-opacity="0.55" />
                      <stop offset="1" stop-color="#000" stop-opacity="0" />
                    </linearGradient>
                    <linearGradient id="shBottom" x1="0" y1="1" x2="0" y2="0">
                      <stop offset="0" stop-color="#000" stop-opacity="0.55" />
                      <stop offset="1" stop-color="#000" stop-opacity="0" />
                    </linearGradient>
                    <linearGradient id="shLeft" x1="0" y1="0" x2="1" y2="0">
                      <stop offset="0" stop-color="#000" stop-opacity="0.55" />
                      <stop offset="1" stop-color="#000" stop-opacity="0" />
                    </linearGradient>
                    <linearGradient id="shRight" x1="1" y1="0" x2="0" y2="0">
                      <stop offset="0" stop-color="#000" stop-opacity="0.55" />
                      <stop offset="1" stop-color="#000" stop-opacity="0" />
                    </linearGradient>
                  </defs>
                  <g fill="url(#dpFill)">
                    <rect x="7.3" y="0" width="7.4" height="22" rx="1.3" />
                    <rect x="0" y="7.3" width="22" height="7.4" rx="1.3" />
                  </g>
                  <rect class="dpad__shade dpad__shade--up" x="7.3" y="0" width="7.4" height="8" rx="1.3" fill="url(#shTop)" />
                  <rect class="dpad__shade dpad__shade--down" x="7.3" y="14" width="7.4" height="8" rx="1.3" fill="url(#shBottom)" />
                  <rect class="dpad__shade dpad__shade--left" x="0" y="7.3" width="8" height="7.4" rx="1.3" fill="url(#shLeft)" />
                  <rect class="dpad__shade dpad__shade--right" x="14" y="7.3" width="8" height="7.4" rx="1.3" fill="url(#shRight)" />
                  <g fill="#000" fill-opacity="0.38">
                    <polygon points="11,2 9.5,4.3 12.5,4.3" />
                    <polygon points="11,20 9.5,17.7 12.5,17.7" />
                    <polygon points="2,11 4.3,9.5 4.3,12.5" />
                    <polygon points="20,11 17.7,9.5 17.7,12.5" />
                  </g>
                  <circle cx="11" cy="11" r="2.3" fill="url(#dpHub)" />
                </svg>
              </div>
            </div>

            <div class="ab-slot"></div>
            <div class="pad-btn pad-btn--b" id="btnB"></div>
            <div class="pad-btn pad-btn--a" id="btnA"></div>
            <span class="pad-label pad-label--b">B</span>
            <span class="pad-label pad-label--a">A</span>

            <div class="pill pill--select">
              <div class="pill__well"><div class="pill__btn" id="btnSelect"></div></div>
              <span class="pill__label">SELECT</span>
            </div>
            <div class="pill pill--start">
              <div class="pill__well"><div class="pill__btn" id="btnStart"></div></div>
              <span class="pill__label">START</span>
            </div>

            <div class="speaker"><i></i><i></i><i></i><i></i><i></i><i></i></div>
          </div>

          <div class="device__grain" aria-hidden="true"></div>
        </div>
      </div>

      <div class="dock" id="dock">
        <div class="switcher" id="switcher" role="group" aria-label="Choose who to play as"></div>
        <div class="hint" id="hint" aria-hidden="true"></div>
      </div>
    </div>

    <script src="dialogue.js"></script>
    <script src="game.js"></script>
  </body>
</html>
